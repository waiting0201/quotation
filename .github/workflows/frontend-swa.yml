name: Frontend (Angular) → Azure Static Web Apps

on:
  push:
    branches:
      - master
    paths:
      - "Admin/**"
      - ".github/workflows/frontend-swa.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
    paths:
      - "Admin/**"
      - ".github/workflows/frontend-swa.yml"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        # 已合併為單一 repo，不再需要 submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Admin/package-lock.json

      - name: Install dependencies
        working-directory: Admin
        run: npm ci

      - name: Build (production)
        working-directory: Admin
        run: npx ng build --configuration=production

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_POND_08D275D1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Admin 改為子資料夾，路徑加上 Admin/ 前綴
          app_location: "Admin/dist/Admin/browser"
          api_location: ""
          output_location: "."
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_POND_08D275D1E }}
          action: "close"
