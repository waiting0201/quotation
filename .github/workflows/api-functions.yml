name: API (.NET 10) → Azure Functions

on:
  push:
    branches:
      - master
    paths:
      - "Api/**"
      - "global.json"
      - ".github/workflows/api-functions.yml"
  workflow_dispatch:

env:
  # ⚠️ 部署前請填入實際的 Azure Functions App 名稱
  AZURE_FUNCTIONAPP_NAME: quotation-api
  DOTNET_VERSION: "10.0.x"
  WORKING_DIRECTORY: Api

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.WORKING_DIRECTORY }}/QuotationApi.csproj

      - name: Build
        run: dotnet build ${{ env.WORKING_DIRECTORY }}/QuotationApi.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.WORKING_DIRECTORY }}/QuotationApi.csproj -c Release -o ./output --no-build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          # 在 GitHub repo Settings → Secrets 設定 Function App 的發布設定檔
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
