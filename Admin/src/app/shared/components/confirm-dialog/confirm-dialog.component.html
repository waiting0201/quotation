<!-- 遮罩層 -->
<div
  class="fixed inset-0 bg-black/40 flex items-center justify-center z-[var(--z-modal)]"
  (click)="onCancel()"
>
  <!-- 對話框 (阻止冒泡) -->
  <div
    class="bg-white rounded-[var(--radius-modal)] w-full max-w-md mx-4 overflow-hidden"
    style="box-shadow: var(--shadow-modal);"
    (click)="$event.stopPropagation()"
  >
    <!-- 標頭 -->
    <div class="px-6 pt-5 pb-4">
      <h3 class="text-lg font-semibold text-slate-900">{{ title() }}</h3>
      <p class="mt-2 text-sm text-slate-600">{{ message() }}</p>
    </div>

    <!-- 操作按鈕 -->
    <div class="flex items-center justify-end gap-2.5 px-6 pb-5">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-[var(--radius-btn)] hover:bg-slate-50 transition-colors"
        (click)="onCancel()"
      >
        {{ cancelText() }}
      </button>
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-white rounded-[var(--radius-btn)] transition-colors"
        [class]="danger()
          ? 'bg-red-600 hover:bg-red-700'
          : 'bg-primary-600 hover:bg-primary-700'"
        (click)="onConfirm()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
