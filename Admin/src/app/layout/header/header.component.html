<header
  class="fixed top-0 right-0 flex items-center px-4 z-[var(--z-header)]"
  [style.left]="isMobile() ? '0' : (sidebarCollapsed() ? 'var(--sidebar-mini-width)' : 'var(--sidebar-width)')"
  [style.height]="'var(--header-height)'"
  style="
    background: rgba(30, 30, 30, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 #3C3C3C;
    border-bottom: 1px solid #3C3C3C;
    transition: left var(--transition-sidebar);
  "
>
  <!-- 左側：漢堡按鈕 -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="header-toggle-btn"
      (click)="onToggle()"
      aria-label="切換側邊欄"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- 右側：使用者資訊 + 登出 -->
  <div class="ml-auto flex items-center gap-3">
    @if (currentUser()) {
      <!-- 使用者名稱 -->
      <span
        class="text-sm hidden sm:inline-block"
        style="color: #CCCCCC;"
      >{{ currentUser()!.name }}</span>

      <!-- 圓形頭像 -->
      <div
        class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold shrink-0"
        style="background: rgba(0, 127, 212, 0.20); color: #00D4FF;"
      >
        {{ currentUser()!.name.charAt(0) }}
      </div>
    }

    <!-- 登出按鈕 -->
    <button
      type="button"
      class="header-logout-btn"
      (click)="onLogout()"
      aria-label="登出"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="hidden sm:inline-block">登出</span>
    </button>
  </div>
</header>
