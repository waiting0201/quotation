<!-- Modal Overlay -->
<div class="modal-overlay" (click)="onCancel()">
  <!-- Dialog (stop propagation) -->
  <div class="modal" (click)="$event.stopPropagation()">

    <!-- Neon top line -->
    <div class="modal-neon-line"></div>

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-title">
        <span class="modal-title-icon">
          @if (isEditMode()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          }
        </span>
        {{ dialogTitle() }}
      </div>
      <button type="button" class="modal-close" (click)="onCancel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="form-group">
          <label class="form-label">
            付款條件說明
            <span class="required">*</span>
          </label>
          <textarea
            class="form-textarea"
            [class.error]="remarkInvalid"
            formControlName="remark"
            placeholder="請輸入付款條件說明，例如：月結30天"
            rows="4"
            autocomplete="off"
          ></textarea>
          @if (remarkInvalid) {
            <div class="form-error">
              @if (remarkControl.errors?.['required']) {
                請輸入付款條件說明
              } @else if (remarkControl.errors?.['maxlength']) {
                付款條件說明不可超過 500 個字元
              }
            </div>
          }
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-ghost" (click)="onCancel()" [disabled]="saving()">
        取消
      </button>
      <button
        type="button"
        class="btn-primary"
        (click)="onSave()"
        [disabled]="saving()"
      >
        @if (saving()) {
          <span class="spinner"></span>
          儲存中...
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          儲存
        }
      </button>
    </div>

  </div>
</div>
