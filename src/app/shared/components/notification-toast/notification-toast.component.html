<div class="fixed bottom-5 right-5 flex flex-col gap-2.5 z-[var(--z-toast)] w-80">
  @for (n of notifications(); track n.id) {
    <div
      class="flex items-start gap-3 p-4 rounded-lg shadow-lg text-sm"
      [class]="toastClasses(n.type)"
      role="alert"
    >
      <!-- 圖示 -->
      <span class="shrink-0 mt-0.5">
        @switch (n.type) {
          @case ('success') {
            <svg class="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('error') {
            <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('warning') {
            <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          }
        }
      </span>

      <!-- 訊息 -->
      <span class="flex-1 text-slate-800">{{ n.message }}</span>

      <!-- 關閉按鈕 -->
      <button
        type="button"
        class="shrink-0 text-slate-400 hover:text-slate-600 transition-colors"
        (click)="dismiss(n.id)"
        aria-label="關閉通知"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
